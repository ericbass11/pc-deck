<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Parear PC Deck</title>
  <link rel="icon" href="/icon-192.png">
  <link rel="stylesheet" href="/style.css">
  <style>
    body { -webkit-user-select: text; user-select: text; max-width: 760px; margin: 0 auto; }
    .pair { display: grid; gap: 16px; }
    .card { padding: 20px; border: 1px solid var(--line); border-radius: var(--radius); background: var(--surface); }
    .row { display: flex; gap: 20px; align-items: center; flex-wrap: wrap; }
    .qr { background: #fff; padding: 12px; border-radius: 14px; line-height: 0; }
    .card h2 { margin: 0 0 6px; font-size: 16px; }
    .card p, li { color: var(--muted); line-height: 1.5; }
    code { color: var(--text); word-break: break-all; }
    .warn { border-color: #6b4a1a; }
    button.rot { border: 1px solid var(--line); background: var(--surface-2); color: var(--text); font: inherit; padding: 8px 14px; border-radius: 12px; cursor: pointer; }
  </style>
</head>
<body>
  <header class="bar"><h1>Parear celular</h1></header>
  <div class="pair" id="list"></div>
  <script src="/vendor/qrcode.min.js"></script>
  <script>
    const list = document.getElementById('list');
    async function load(rotate) {
      const r = await fetch('/api/pairing' + (rotate ? '?rotate=1' : ''), { method: rotate ? 'POST' : 'GET' });
      const data = await r.json();
      list.innerHTML = '';
      if (!data.urls.length) {
        list.innerHTML = `<div class="card warn"><h2>Nenhum endereço para o celular ainda</h2>
          <p>Rode <code>tailscale serve --bg ${data.port}</code> (recomendado, HTTPS) ou reinicie o agente com <code>--lan</code>. Depois recarregue esta página.</p></div>`;
      }
      for (const u of data.urls) {
        const card = document.createElement('div');
        card.className = 'card';
        card.innerHTML = `<div class="row"><div class="qr"></div><div style="flex:1;min-width:220px">
          <h2></h2><p>Aponte a câmera do celular. Depois, no Chrome: menu ⋮ → <b>Instalar app</b> / <b>Adicionar à tela inicial</b>.</p></div></div>`;
        card.querySelector('h2').textContent = u.label;
        list.append(card);
        new QRCode(card.querySelector('.qr'), { text: u.url, width: 200, height: 200, correctLevel: QRCode.CorrectLevel.M });
      }
      const foot = document.createElement('div');
      foot.className = 'card';
      foot.innerHTML = `<h2>Segurança</h2><p>O QR contém a chave de acesso. Não compartilhe. Se vazar, gere uma nova (todos os celulares terão que parear de novo).</p>
        <button class="rot" type="button">Gerar nova chave</button>`;
      foot.querySelector('button').onclick = () => confirm('Desparear todos os celulares?') && load(true);
      list.append(foot);
    }
    load(false);
  </script>
</body>
</html>
